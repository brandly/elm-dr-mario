<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>dr. mario</title>
    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">

    <style>
      html {
        box-sizing: border-box;
        font-family: Frutiger, "Frutiger Linotype", Univers, Calibri, "Gill Sans", "Gill Sans MT", "Myriad Pro", Myriad, "DejaVu Sans Condensed", "Liberation Sans", "Nimbus Sans L", Tahoma, Geneva, "Helvetica Neue", Helvetica, Arial, sans-serif;

      }
      *, *:before, *:after {
        box-sizing: inherit;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Press Start 2P', cursive;
      }
      h3 {
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="elm"></div>
    <script src="the.js"></script>
    <script>
      Elm.Main.init({
        node: document.getElementById('elm')
      });

      // The arrow keys steer the pill and move through the menus, but they also
      // scroll the page. Elm registers its `Browser.Events.onKeyDown` listener
      // as passive, so it can't cancel that itself. This listener can: calling
      // preventDefault here drops the scroll while Elm still hears the keydown.
      var GAME_KEYS = ['ArrowUp', 'ArrowLeft', 'ArrowRight', 'ArrowDown'];
      document.addEventListener('keydown', function (event) {
        var tagName = event.target && event.target.tagName;
        if (tagName === 'INPUT' || tagName === 'TEXTAREA' || tagName === 'SELECT') {
          return;
        }
        if (GAME_KEYS.indexOf(event.key) !== -1) {
          event.preventDefault();
        }
      });
    </script>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-48129598-9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'UA-48129598-9');
    </script>
  </body>
</html>
